name: Unpack site
on:
  push:
    paths:
      - 'site.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack site.zip
        run: |
          if [ ! -f site.zip ]; then echo "no site.zip, nothing to do"; exit 0; fi
          unzip -o site.zip -d unpacked
          shopt -s dotglob nullglob
          mv unpacked/android-4-0-4/* .
          rm -rf unpacked site.zip
      - name: Commit unpacked files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "Unpack site.zip"
          git push
